<header class="site-header">
  <div class="header-inner">
    <a class="site-name" href="{{ '/' | relative_url }}" aria-label="Erin Barrett home">Erin Barrett</a>
    <nav class="site-nav" aria-label="Main navigation">
      <ul>
        {% for item in site.data.navigation %}
          <li>
            <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
          </li>
        {% endfor %}
      </ul>
    </nav>
    <div class="theme-control">
      <input id="theme-toggle" type="checkbox">
      <label for="theme-toggle">Dark theme</label>
    </div>
  </div>
</header>
