<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    {% include seo.html %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include header.html %}
    <main id="main-content" class="page-shell{% if page.layout == 'home' %} page-shell--home{% endif %}">
      {% unless page.layout == 'home' %}
        <header class="page-heading">
          {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
          <h1>{{ page.title }}</h1>
          {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
        </header>
      {% endunless %}
      {{ content }}
    </main>
    {% include footer.html %}
  </body>
</html>
